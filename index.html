<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Welle — Vorstellungen</title>

<style>
:root{
  --green:#1a9e6e;
  --border:#e2e0d8;
  --surface:#ffffff;
  --text:#1c1c1a;
  --muted:#7a7870;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f4f0;
  padding:40px;
}

/* CARD */

.show-card{
  width:320px;
  background:var(--surface);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
}

.card-img{
  position:relative;
  height:200px;
  background:url('https://picsum.photos/500/300') center/cover no-repeat;
}

/* ========================= */
/* YOUR FIXED BADGE CODE */
/* ========================= */

.badge-status{
  position:absolute;
  top:12px;
  right:12px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:4px 10px;

  border-radius:999px;

  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;

  width:auto;
  height:auto;
  line-height:1;

  z-index:2;
}

.badge-verfugbar{
  background:var(--green);
  color:#fff;
}

/* ========================= */

.card-body{
  padding:20px;
}

.card-title{
  font-size:22px;
  margin-bottom:10px;
}

.meta-row{
  font-size:14px;
  color:var(--muted);
  margin-bottom:6px;
}

</style>
</head>

<body>

<div class="show-card">

  <div class="card-img">

    <!-- SMALL GREEN BADGE -->
    <span class="badge-status badge-verfugbar">
      VERFÜGBAR
    </span>

  </div>

  <div class="card-body">

    <div class="card-title">
      Die Welle
    </div>

    <div class="meta-row">
      Freitag, 19. Juni 2026
    </div>

    <div class="meta-row">
      Schulhaus Gubel
    </div>

  </div>

</div>

</body>
</html>
